# 测试环境配置（@WebMvcTest 切片）
# 关闭 Nacos 配置中心校验与加载：测试不连外部配置中心，
# 否则 spring-cloud-starter-alibaba-nacos-config 的 ConfigDataMissingEnvironmentPostProcessor
# 会因缺少 spring.config.import 而阻止上下文启动。
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false

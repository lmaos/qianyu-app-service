qianyu:
  # 存储配置
  storage:
    # 默认存储平台: aliyun / tencent
    default-platform: aliyun
    aliyun:
      access-key-id: ${ALI_OSS_ACCESS_KEY_ID}
      access-key-secret: ${ALI_OSS_ACCESS_KEY_SECRET}
      endpoint: ${ALI_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
      bucket-name: ${ALI_OSS_BUCKET_NAME}
      # 自定义域名（可选）
      custom-domain: ${ALI_OSS_DOMAIN}
    tencent:
      secret-id: your-tencent-secret-id
      secret-key: your-tencent-secret-key
      region: ap-guangzhou
      bucket-name: your-tencent-bucket-name
      # 自定义域名（可选）
      custom-domain: ${TENCENT_OSS_DOMAIN}
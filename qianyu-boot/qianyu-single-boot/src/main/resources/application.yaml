spring:
  application:
    name: qianyu-single-boot
  profiles:
    active: @spring.profiles.active@
  # 使用虚拟线程
  threads:
    virtual:
      enabled: true
  # 加载配置。nacos 配置中心相关配置 -- 暂时关闭
  config:
    import: optional:nacos:${spring.application.name}.yaml
  # nacos 配置中心相关配置 -- 暂时关闭
  cloud:
    nacos:
      config:
        enabled: false

  # spring-data-redis 相关配置
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 没有密码就空着
      database: 1
      timeout: 10s
      # 连接池
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5s

  # 数据库相关配置
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://127.0.0.1/qianyu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（极简、稳定、生产级）
    hikari:
      pool-name: QIANYU-DB-POOL         # 连接池名字
      minimum-idle: 10                  # 最小空闲连接
      maximum-pool-size: 20              # 最大连接数（核心）
      idle-timeout: 300000               # 空闲超时 5分钟
      max-lifetime: 1800000              # 连接最大生命周期 30分钟
      connection-timeout: 3000           # 获取连接超时 3秒
      auto-commit: true
# mybatis-flex 配置
mybatis-flex:
  configuration:
    # 开启懒加载（核心）
    lazy-loading-enabled: true
    # 关闭积极加载（必须关，否则懒加载不生效）
    aggressive-lazy-loading: false
    # 启用方法级别的懒加载触发（推荐开启）
    lazy-load-trigger-methods: equals,clone,hashCode,toString
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 控制台打印SQL（本地调试用）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dubbo:
  protocol:
    name: dubbo
    port: -1                         # 随机端口（如果还会对外暴露服务的话）
  registry:
    address: N/A                     # 不使用注册中心



qianyu:
  # 存储配置
  storage:
    # 默认存储平台: aliyun / tencent
    default-platform: aliyun
    aliyun:
      access-key-id: ${ALI_OSS_ACCESS_KEY_ID}
      access-key-secret: ${ALI_OSS_ACCESS_KEY_SECRET}
      endpoint: ${ALI_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
      bucket-name: ${ALI_OSS_BUCKET_NAME}
      # 自定义域名（可选）
      custom-domain: ${ALI_OSS_DOMAIN}
    tencent:
      secret-id: your-tencent-secret-id
      secret-key: your-tencent-secret-key
      region: ap-guangzhou
      bucket-name: your-tencent-bucket-name
      # 自定义域名（可选）
      custom-domain:

  # IM配置
  im:
    tencent:
      sdkAppId: ${IM_TENCENT_APPID}
      secretKey: ${IM_TENCENT_SECRETKEY}
      adminIdentifier: 10000

  # 短信登录验证配置
  sms:
    aliyun:
      enabled: true
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET}
      endpoint: dysmsapi.aliyuncs.com
      sign-name: ${ALIYUN_SMS_SIGN_NAME}

  # 登录相关配置
  login:
    verifier:
      # 登录验证器使用的公钥，通常是前端加密登录信息时使用的公钥（核心）。如果不指定公钥，则登录验证器将无法工作。
      public-key: 
      # 公钥文件路径，如果指定了公钥文件路径，则上面的 public-key 配置将被忽略
      public-key-path:
    signer:
      # 登录验证器使用的私钥，通常是后端解密登录信息时使用的私钥（核心）。如果不指定私钥，则登录验证器将无法工作。
      private-key: 
      # 私钥文件路径， 如果指定了私钥文件路径，则上面的 private-key 配置将被忽略
      private-key-path:
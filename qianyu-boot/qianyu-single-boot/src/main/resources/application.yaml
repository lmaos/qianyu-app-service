spring:
  application:
    name: qianyu-single-boot

  profiles:
    active: @spring.profiles.active@

  # 使用虚拟线程
  threads:
    virtual:
      enabled: true

  config:
    import: optional:nacos:${spring.application.name}.yaml
  # nacos 配置中心相关配置
  cloud:
    nacos:
      config:
        enabled: false # 未用到所以先禁用

  # spring-data-redis 相关配置
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 没有密码就空着
      database: 1
      timeout: 10s
      # 连接池
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5s

  # 数据库相关配置
  datasource:
    url: jdbc:mysql://localhost:3306/qianyu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（极简、稳定、生产级）
    hikari:
      pool-name: QIANYU-DB-POOL         # 连接池名字
      minimum-idle: 10                  # 最小空闲连接
      maximum-pool-size: 20              # 最大连接数（核心）
      idle-timeout: 300000               # 空闲超时 5分钟
      max-lifetime: 1800000              # 连接最大生命周期 30分钟
      connection-timeout: 3000           # 获取连接超时 3秒
      auto-commit: true
# mybatis 配置
mybatis:
  configuration:
    # 开启懒加载（核心）
    lazy-loading-enabled: true
    # 关闭积极加载（必须关，否则懒加载不生效）
    aggressive-lazy-loading: false
    # 启用方法级别的懒加载触发（推荐开启）
    lazy-load-trigger-methods: equals,clone,hashCode,toString
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 控制台打印SQL（本地调试用）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


dubbo:
  protocol:
    name: dubbo
    port: -1
  registry:
    address: N/A
    register-mode: all
    group: dubbo
  provider:
    filter: rpcResponseFilter
  consumer:
    filter: rpcUnpackFilter